name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed GitHub Release (other branches only check signing setup)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  signing-setup:
    name: Check Android signing setup
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check for required secrets without exposing their values
        env:
          HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            flag="HAS_$name"
            if [[ "${!flag}" != true ]]; then
              echo "::error::Missing Android signing secret: $name"
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi
          echo '::notice::All required signing secrets are configured. The release job verifies the APK signature.'

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Android app
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx --no-install cap add android
          npx --no-install capacitor-assets generate --android --assetPath . \
            --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' \
            --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0f1320'
          test -s android/app/src/main/res/mipmap-ldpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-night/splash.png
          npx --no-install cap sync android
          cmp index.html android/app/src/main/assets/public/index.html

      - name: Set Android version
        id: version
        env:
          VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+$ || ! "$VERSION_CODE_OFFSET" =~ ^[0-9]{1,10}$ ]]; then
            echo '::error::Expected a major.minor package version and a non-negative VERSION_CODE_OFFSET.'
            exit 1
          fi
          code=$((GITHUB_RUN_NUMBER + 10#$VERSION_CODE_OFFSET))
          if (( code < 1 || code > 2100000000 )); then
            echo '::error::Android versionCode must be between 1 and 2100000000.'
            exit 1
          fi
          version="$base.$GITHUB_RUN_NUMBER"
          gradle_file=android/app/build.gradle
          sed -i -E "s/^(\s*versionCode) [0-9]+$/\1 $code/; s/^(\s*versionName) \"[^\"]*\"$/\1 \"$version\"/" "$gradle_file"
          grep -F "versionCode $code" "$gradle_file"
          grep -F "versionName \"$version\"" "$gradle_file"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: |
          tasks=(:app:assembleRelease)
          if [[ "$PUBLISH" != true ]]; then
            tasks=(:app:assembleDebug "${tasks[@]}")
          fi
          log="$RUNNER_TEMP/mindlab-gradle.log"
          if ! bash gradlew "${tasks[@]}" --no-daemon --console=plain 2>&1 | tee "$log"; then
            detail=$(awk '/^\* What went wrong:/{show=1; next} /^\* Try:/{show=0} show && ++lines <= 30 {print substr($0,1,320)}' "$log")
            if [[ -z "$detail" ]]; then detail=$(tail -n 20 "$log"); fi
            detail=${detail//%/%25}
            detail=${detail//$'\n'/%0A}
            detail=${detail//$'\r'/%0D}
            printf '::error title=Gradle APK build failed::%s\n' "$detail"
            exit 1
          fi
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload test APK
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: MindLab-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: MindLab-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  publish:
    name: Sign and publish APK
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [build, signing-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-public-release
      cancel-in-progress: false
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v7
        with:
          name: MindLab-unsigned-apk

      - name: Align, sign and verify APK
        env:
          VERSION: ${{ needs.build.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android signing secret: $name"
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/mindlab-signing.XXXXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"

          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="MindLab-v$VERSION.apk"
          "$tools/zipalign" -P 16 -f 4 app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_dir/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" "$signing_dir/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" "$APK_FILE" "$APK_FILE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Mind Lab $VERSION" \
            --notes "Signed Android APK from commit ${GITHUB_SHA::7}. Download the APK below to install Mind Lab."
